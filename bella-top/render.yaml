services:
  - type: web
    name: bella-top
    runtime: node
    rootDir: bella-top
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Modo de teste SEM LOGIN: "1" = toca na máquina e entra; "0" = login com senha.
      - key: BELLATOP_OPEN_ACCESS
        value: "1"
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GEMINI_API_KEY
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: DRIVE_BRIDGE_URL
        sync: false
      - key: DRIVE_BRIDGE_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
